  function getSvgIcon(name, size, color){
    var svg = SVG_ICONS[name] || '';
    if(!svg) return '';
    if(size){
      svg = svg.replace(/width="[0-9.]+"/, 'width="' + size + '"').replace(/height="[0-9.]+"/, 'height="' + size + '"');
    }
    if(color){
      svg = svg.replace(/stroke="currentColor"/g, 'stroke="' + color + '"');
    }
    return svg;
  }

  var QUESTION_TYPES = [
    {id:'서술형', badgeClass:'badge-essay',        icon: getSvgIcon('essay', 13), evalMethod:'서술형시험', lineCount:3},
    {id:'질문형', badgeClass:'badge-question',      icon: getSvgIcon('interview', 13), evalMethod:'면접형시험', lineCount:2},
    {id:'발표형', badgeClass:'badge-presentation',  icon: getSvgIcon('presentation', 13), evalMethod:'발표형시험', lineCount:2},
    {id:'작업형', badgeClass:'badge-work',          icon: getSvgIcon('work', 13), evalMethod:'작업형평가', lineCount:2}
  ];
  function getQuestionTypeInfo(type){
    return QUESTION_TYPES.find(function(t){ return t.id===type; }) || null;
  }
  var EVAL_METHOD_MAP = {};
  QUESTION_TYPES.forEach(function(t){ EVAL_METHOD_MAP[t.id] = t.evalMethod; });

  function escapeHtml(str){
    if(str===undefined || str===null) return '';
    return String(str).replace(/[&<>"']/g, function(m){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
    });
  }

  function nl2br(str){
    if(str===undefined || str===null) return '';
    return escapeHtml(String(str)).replace(/\n/g,'<br>');
  }

  function localGet(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  function localSet(key, value){
    try{ localStorage.setItem(key, value); }catch(e){}
  }
  function localRemove(key){
    try{ localStorage.removeItem(key); }catch(e){}
  }
  function sessionGet(key){
    try{ return sessionStorage.getItem(key); }catch(e){ return null; }
  }
  function sessionSet(key, value){
    try{ sessionStorage.setItem(key, value); }catch(e){}
  }
  function sessionRemove(key){
    try{ sessionStorage.removeItem(key); }catch(e){}
  }
  function authSessionKey(url){
    return 'problem-bank-auth-token:' + String(url || '');
  }

  function typeBadge(type){
    var info = getQuestionTypeInfo(type);
    var cls = info ? info.badgeClass : 'badge-default';
    var icon = info ? info.icon : '❔';
    return '<span class="badge ' + cls + '">' + icon + ' ' + escapeHtml(type || '미정') + '</span>';
  }

  var COMPANY_COLORS = [
    {bg:'#eef2ff', text:'#4338ca'},
    {bg:'#ecfdf5', text:'#047857'},
    {bg:'#fef3c7', text:'#b45309'},
    {bg:'#fee2e2', text:'#b91c1c'},
    {bg:'#f3e8ff', text:'#7e22ce'},
    {bg:'#e0e7ff', text:'#0369a1'},
    {bg:'#fce7f3', text:'#be185d'},
    {bg:'#ecfccb', text:'#4d7c0f'},
    {bg:'#ffedd5', text:'#c2410c'},
    {bg:'#e0e7ff', text:'#3730a3'}
  ];
  function getCompanyColor(companyId){
    var str = String(companyId);
    var hash = 0;
    for(var i=0;i<str.length;i++){ hash = (hash*31 + str.charCodeAt(i)) >>> 0; }
    return COMPANY_COLORS[hash % COMPANY_COLORS.length];
  }
  function companyChip(companyId, companyName, clickable){
    var color = getCompanyColor(companyId);
    if(clickable){
      return '<button type="button" class="company-badge" data-action="goto-company" data-company-id="'+escapeHtml(companyId)+'" style="background:'+color.bg+';color:'+color.text+';">'+escapeHtml(companyName)+'</button>';
    }
    return '<span class="company-badge" style="background:'+color.bg+';color:'+color.text+';">'+escapeHtml(companyName)+'</span>';
  }

  function formatTodayDate(){
    var d = new Date();
    var yyyy = d.getFullYear();
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return yyyy+'.'+mm+'.'+dd+'.';
  }
  function todayISO(){
    var d = new Date();
    var yyyy = d.getFullYear();
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return yyyy+'-'+mm+'-'+dd;
  }
  function formatDisplayDate(isoStr){
    if(!isoStr) return '';
    var parts = isoStr.split('-');
    if(parts.length!==3) return isoStr;
    return parts[0]+'.'+parts[1]+'.'+parts[2]+'.';
  }

  function getCompanySubjects(companyId, year){
    var targetYear = year || state.year || '2026';
    var assignedList = state.assignments
      .filter(function(a){
        var matchCo = String(a.기업ID)===String(companyId);
        var matchYr = !a.연도 || String(a.연도)===String(targetYear);
        return matchCo && matchYr;
      })
      .sort(function(a,b){ return (parseInt(a.순서,10)||999) - (parseInt(b.순서,10)||999); });
    return assignedList.map(function(a){
      return state.subjects.find(function(s){ return String(s.과목ID)===String(a.과목ID); });
    }).filter(Boolean);
  }

  function getSubjectOrderLabel(companyId, subjectId){
    var subs = getCompanySubjects(companyId);
    var idx = subs.findIndex(function(s){ return String(s.과목ID)===String(subjectId); });
    return idx>=0 ? '제'+(idx+1)+'과목' : '';
  }

  function getCompanyAssignments(companyId, year){
    var targetYear = year || state.year || '2026';
    return state.assignments
      .filter(function(a){
        var matchCo = String(a.기업ID)===String(companyId);
        var matchYr = !a.연도 || String(a.연도)===String(targetYear);
        return matchCo && matchYr;
      })
      .sort(function(a,b){ return (parseInt(a.순서,10)||999) - (parseInt(b.순서,10)||999); });
  }

  function getYearStudents(companyId, year){
    var targetYear = year || state.year || '2026';
    return state.students.filter(function(s){
      var matchYr = !s.연도 || String(s.연도)===String(targetYear);
      if(companyId) return String(s.기업ID)===String(companyId) && matchYr;
      return matchYr;
    });
  }

  function updateYearSelectUI(){
    var sel = document.getElementById('yearSelect');
    if(!sel) return;

    var yearSet = {};
    yearSet[state.year || '2026'] = true;
    if(state.years && state.years.length > 0){
      state.years.forEach(function(y){ yearSet[String(y)] = true; });
    }
    state.assignments.forEach(function(a){ if(a.연도) yearSet[String(a.연도)] = true; });
    state.students.forEach(function(s){ if(s.연도) yearSet[String(s.연도)] = true; });

    var yearList = Object.keys(yearSet).sort();
    state.years = yearList;

    var optionsHtml = yearList.map(function(y){
      var selected = String(y)===String(state.year) ? 'selected' : '';
      return '<option value="'+escapeHtml(y)+'" '+selected+'>'+escapeHtml(y)+'년</option>';
    }).join('') + '<option value="add_new">➕ 연도 추가...</option>';

    sel.innerHTML = optionsHtml;
  }

  var reorderState = { list: [], companyId: null };
  var assignReorderBusy = false;

  function setOrderButtonsBusy(busy){
    document.querySelectorAll('.order-btn').forEach(function(b){
      b.disabled = busy;
      if(busy){
        if(!b.dataset.origText) b.dataset.origText = b.textContent;
        b.textContent = '⏳ 저장 중';
      } else if(b.dataset.origText){
        b.textContent = b.dataset.origText;
        delete b.dataset.origText;
      }
    });
  }

  async function reorderSubjectStep(companyId, subjectId, dir){
    if(assignReorderBusy) return;
    if(!companyId || !subjectId) return;

    var assigns = getCompanyAssignments(companyId);
    var idx = assigns.findIndex(function(a){ return String(a.과목ID)===String(subjectId); });
    if(idx<0) return;
    var targetIdx = dir==='up' ? idx-1 : idx+1;
    if(targetIdx<0 || targetIdx>=assigns.length) return;

    var moved = assigns.splice(idx,1)[0];
    assigns.splice(targetIdx,0,moved);

  function applyServerData(data){
    if(!data || typeof data !== 'object') throw new Error('서버 데이터 형식이 올바르지 않습니다');
    state.students = Array.isArray(data.students) ? data.students : [];
    state.companies = Array.isArray(data.companies) ? data.companies : [];
    state.subjects = Array.isArray(data.subjects) ? data.subjects : [];
    state.questions = Array.isArray(data.questions) ? data.questions : [];
    state.assignments = Array.isArray(data.assignments) ? data.assignments : [];
  }

  async function postApi(url, payload){
    var res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var result = await res.json();
    if(!result || typeof result !== 'object') throw new Error('서버 응답 형식이 올바르지 않습니다');
    return result;
  }

  async function fetchData(url){
    var inMemoryToken = state.url === url ? state.sessionToken : '';
    state.url = url;
    state.error = null;
    setStatus('loading');
    render();
    try{
      var token = inMemoryToken || sessionGet(authSessionKey(url));
      if(token){
        var readResult = await postApi(url, {action:'read', token:token});
        if(readResult.success && readResult.authenticated && readResult.data){
          state.sessionToken = token;
          state.authenticated = true;
          state.loginError = null;
          applyServerData(readResult.data);
        } else if(readResult.code === 'UNAUTHORIZED'){
          sessionRemove(authSessionKey(url));
          state.sessionToken = '';
          state.authenticated = false;
          state.loginError = '로그인 세션이 만료되었습니다. 다시 로그인해주세요.';
          clearServerData();
        } else {
          throw new Error(readResult.error || '데이터 조회에 실패했습니다');
        }
      } else {
        var res = await fetch(url);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        var statusResult = await res.json();
        if(!statusResult || !statusResult.success){
          throw new Error((statusResult && statusResult.error) || '서버 인증 상태를 확인하지 못했습니다');
        }
        state.sessionToken = '';
        state.authenticated = false;
        state.loginError = null;
        clearServerData();
      }
      state.loaded = true;
      setStatus('on');
      localSet('webapp-url', url);
    }catch(err){
      state.error = '데이터를 불러오지 못했습니다 (' + err.message + '). URL과 배포 설정(액세스 권한: 모든 사용자)을 확인해주세요.';
      setStatus('error');
    }
    render();
  }

      state.authenticated = false;
      clearServerData();
      render();
      return false;
    }
    try{
      var result = await postApi(state.url, {
        sheet:sheetName,
        action:action,
        data:data,
        token:state.sessionToken
      });
      if(result.code === 'UNAUTHORIZED'){
        sessionRemove(authSessionKey(state.url));

        state.loginError = '로그인 세션이 만료되었습니다. 다시 로그인해주세요.';
        clearServerData();
        setStatus('on');
        render();
        alert(state.loginError);

  async function persist(sheetName, action, data, idField){
    if(state.url){
      var ok = await writeData(sheetName, action, data);
      if(!ok) return false;
      await fetchData(state.url);
      return true;
    } else {
      var arr = state[ARR_KEY[sheetName]];
      if(action==='create'){
        arr.push(data);
      } else if(action==='update'){
        var idx = arr.findIndex(function(item){ return String(item[idField])===String(data[idField]); });
        if(idx>-1) arr[idx] = data;
      } else if(action==='delete'){
        var idx2 = arr.findIndex(function(item){ return String(item[idField])===String(data[idField]); });
        if(idx2>-1) arr.splice(idx2,1);
      }
      render();
      return true;
    }
  }

  async function deleteCompanyCompletely(companyId){
    var relatedAssigns = state.assignments.filter(function(a){ return String(a.기업ID)===String(companyId); });

    if(state.url){
      var companyDeleteOk = await writeDomainAction('deleteCompanyCascade', {companyId:companyId});

  function nextId(prefix, list, idField){
    var max = 0;
    list.forEach(function(item){
      var m = String(item[idField]).match(new RegExp('^'+prefix+'(\\d+)$'));
      if(m){ var n = parseInt(m[1],10); if(n>max) max = n; }
    });
    return prefix + (max+1);
  }
  function nextStudentId(list){
    var max = 0;
    list.forEach(function(s){
      var m = String(s.학생ID).match(/^ST(\d+)$/);
      if(m){ var n = parseInt(m[1],10); if(n>max) max=n; }
    });
    return 'ST' + String(max+1).padStart(3,'0');
  }
  function nextSubjectId(){
    return nextId('S', state.subjects, '과목ID');
  }
  function nextQuestionNum(subjectId){
    var used = state.questions.filter(function(q){ return String(q.과목ID)===String(subjectId); }).map(function(q){ return parseInt(q.문제번호,10); });
    var n = 1;
    while(used.indexOf(n)>-1){ n++; }
    return n;
  }
  function nextQuestionId(subjectId){
    return subjectId+'-Q'+nextQuestionNum(subjectId);
  }
  function nextAssignmentId(companyId, subjectId){
    return companyId + '_' + subjectId;
  }

      });
      var nextYear1 = maxYear + 1;

  async function checkPassword(){
    var pwInput = document.getElementById('passwordInput');
    var loginBtn = document.getElementById('loginBtn');
    var entered = pwInput ? pwInput.value : '';
    if(!entered){
      state.loginError = '비밀번호를 입력해주세요';
      renderLogin();
      return;
    }
    if(!state.url){
      state.loginError = '연결된 서버가 없습니다';
      renderLogin();
      return;
    }

    if(loginBtn){ loginBtn.disabled = true; loginBtn.textContent = '로그인 중...'; }
    setStatus('loading');
    try{
      var result = await postApi(state.url, {action:'login', password:entered});
      if(!result.success){
        throw new Error(result.error || '로그인에 실패했습니다');
      }
      if(!result.token || !result.data){
        throw new Error('서버 로그인 응답 형식이 올바르지 않습니다');
      }

      state.sessionToken = result.token;
      state.authenticated = true;
      state.loginError = null;
      state.error = null;
      state.loaded = true;
      applyServerData(result.data);
      sessionSet(authSessionKey(state.url), result.token);
      localRemove('auth-pw');
      setStatus('on');
      render();
    }catch(err){
      state.authenticated = false;
      state.sessionToken = '';
      sessionRemove(authSessionKey(state.url));
      clearServerData();
      state.loginError = err.message;
      setStatus('error');
      renderLogin();
    }
  }

      renderLogin();
      return;
    }

    /* 인증 완료 → 앱 표시 */
    showApp();
    renderTabsActive();
    updateAuthUI();
    updateYearSelectUI();

    if(state.activeTab==='overview') renderOverview();
    else if(state.activeTab==='entry') renderEntry();
    else if(state.activeTab==='companies') renderCompanies();
    else if(state.activeTab==='students') renderStudents();
    else if(state.activeTab==='stats') renderStats();
    else if(state.activeTab==='deploy') renderDeploy();
  }

  function renderOverview(){
    var yearStudents = getYearStudents();
    var companyWarnings = [];

      var cnt = getCompanySubjects(c.기업ID).length;
      if(cnt < 6) companyWarnings.push({tag:'company', text: c.기업명 + ': 과목 ' + cnt + '/6개 배정'});
    });
    var unmatched = yearStudents.filter(function(s){
      return !state.companies.find(function(c){ return String(c.기업ID)===String(s.기업ID); });
    });
    if(unmatched.length>0) companyWarnings.push({tag:'student', text: unmatched.length + '명의 학생이 기업과 매칭되지 않았습니다'});

    var subjectWarnings = [];
    state.subjects.forEach(function(s){
      var cnt = state.questions.filter(function(q){ return String(q.과목ID)===String(s.과목ID); }).length;
      if(cnt < 5){
        var usingNames = state.assignments.filter(function(a){ return String(a.과목ID)===String(s.과목ID) && (!a.연도 || String(a.연도)===String(state.year)); })

        subjectWarnings.push({tag:'subject', text: s.과목명 + ': 문제 ' + cnt + '/5개 등록' + (usingNames.length? ' ('+state.year+'년 사용: '+usingNames.join(', ')+')' : ' ('+state.year+'년 미배정)')});
      }
    });

  function updateStudentsTable(){
    var wrap = document.getElementById('studentTableWrap');
    if(!wrap) return;
    var q = state.searchQuery.trim().toLowerCase();
    var companyMap = {};
    state.companies.forEach(function(c){ companyMap[String(c.기업ID)] = c.기업명; });

    var filtered = state.students.filter(function(s){
      if(state.studentCompanyFilter && String(s.기업ID)!==String(state.studentCompanyFilter)) return false;
      if(!q) return true;
      var companyName = (companyMap[String(s.기업ID)] || '').toLowerCase();
      return String(s.이름).toLowerCase().indexOf(q)>-1 ||
             String(s.학생ID).toLowerCase().indexOf(q)>-1 ||
             companyName.indexOf(q)>-1;
    });

    if(filtered.length===0){
      wrap.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div>검색 결과가 없습니다</div></div>';
      return;
    }

    var pageSize = 6;
    var totalCount = filtered.length;
    var totalPages = Math.ceil(totalCount / pageSize) || 1;
    if(!state.studentPage || state.studentPage < 1) state.studentPage = 1;
    if(state.studentPage > totalPages) state.studentPage = totalPages;

    var pageItems = filtered.slice((state.studentPage - 1) * pageSize, state.studentPage * pageSize);

    var cardsHtml = pageItems.map(function(s){
      var companyName = companyMap[String(s.기업ID)];
      var isMatched = !!companyName;

  function getSubjectUsageList(){
    return state.subjects.slice().sort(function(a,b){
      return (a.과목명||'').localeCompare(b.과목명||'','ko');
    }).map(function(s){
      var companies = state.assignments.filter(function(a){ return String(a.과목ID)===String(s.과목ID); })
        .map(function(a){ return state.companies.find(function(cc){return String(cc.기업ID)===String(a.기업ID);}); })
        .filter(Boolean);
      return {name: s.과목명, type: s.문제유형, companies: companies};
    }).sort(function(a,b){ return b.companies.length-a.companies.length; });
  }

  function buildExamFileName(company, selectedSubjects, isTeacherView, hintMode){
    var companyName = company ? company.기업명 : '';

    var viewTag = '';
    if(isTeacherView){
      viewTag = hintMode ? '_학생배포용힌트지' : '_현장교사용모범답안지';
    } else {
      viewTag = '_학생용문제지';
    }

    var subjectTag = '';
    if(selectedSubjects.length === 1){
      var s = selectedSubjects[0];
      var orderLabel = getSubjectOrderLabel(company.기업ID, s.과목ID);
      var orderPart = orderLabel ? '('+orderLabel+')' : '';
      subjectTag = '_' + s.과목명 + orderPart;
    } else if(selectedSubjects.length > 1){
      subjectTag = '_' + selectedSubjects.length + '개과목';
    }

    return companyName + subjectTag + viewTag + '.pdf';
  }

  function downloadExamPdf(){
    var company = state.companies.find(function(c){ return String(c.기업ID)===String(state.deploy.companyId); });
    if(!company) return;

    var selectedSubjects = state.subjects.filter(function(s){ return state.deploy.subjectIds.indexOf(String(s.과목ID))>-1; });
    var isTeacherView = state.deploy.viewMode === 'teacher';
    var fileName = buildExamFileName(company, selectedSubjects, isTeacherView, state.deploy.hintMode).replace(/\.pdf$/i, '');

    var originalTitle = document.title;
    document.title = fileName;

    var restored = false;
    var restoreTitle = function(){
      if(restored) return;
      restored = true;
      document.title = originalTitle;
      window.removeEventListener('afterprint', restoreTitle);
    };
    window.addEventListener('afterprint', restoreTitle);
    setTimeout(restoreTitle, 60000);

    window.print();
  }

      var subjectId4 = subjectSelectEl ? subjectSelectEl.value : (m.context.subjectId || m.data.과목ID);
      if(!subjectId4){ alert('소속 과목을 선택해주세요 (먼저 과목을 등록해주세요)'); return; }
      if(!content4){ alert('문제내용을 입력해주세요'); return; }
      if(!num4 || num4<1){ alert('문제번호는 1 이상의 숫자로 입력해주세요'); return; }
      var dupNum4 = state.questions.find(function(q){
        return String(q.과목ID)===String(subjectId4) && String(q.문제ID)!==String(id4) && parseInt(q.문제번호,10)===num4;
      });
      if(dupNum4){ alert('이미 같은 과목에 문제번호 '+num4+'번이 존재합니다. 다른 번호를 입력해주세요.'); return; }
      if(!pointRaw4 || isNaN(point4) || point4<1){ alert('배점은 1 이상의 숫자로 입력해주세요'); return; }
      payload = {문제ID:id4, 과목ID:subjectId4, 문제번호:num4, 문제내용:content4, 모범답안:answer4, 배점:point4};
    }

    if(!payload) return;
    saveBtn.disabled = true; saveBtn.textContent = '저장 중...';
    var ok = await persist(sheetName, action, payload, ID_FIELD[sheetName]);
    saveBtn.disabled = false; saveBtn.textContent = '저장';
    if(ok) closeModal();
  });

  async function loadGasUrlFromConfig(){
    if(!GAS_CONFIG_URL) return '';
    try{
      var res = await fetch(GAS_CONFIG_URL);
      if(!res.ok) return '';
      var data = await res.json();
      return data.gas_url || '';
    }catch(e){
      return '';
    }
  }

  async function init(){
    localRemove('auth-pw');
    var configUrl = await loadGasUrlFromConfig();
    if(configUrl){
      document.getElementById('urlInput').value = configUrl;
      fetchData(configUrl);
      return;
    }
    var savedUrl = localGet('webapp-url');
    if(savedUrl){
      document.getElementById('urlInput').value = savedUrl;
      fetchData(savedUrl);
      return;
    }
    render();
  }

  init();

  var dragState = { fromId: null, companyId: null, dragging: false, lastDropTime: 0 };

  main.addEventListener('dragstart', function(e){
    var chip = e.target.closest('[data-drag-subject-id]');
    if(!chip) return;
    dragState.fromId  = chip.dataset.dragSubjectId;
    dragState.companyId = state.selectedCompanyId;
    dragState.dragging = true;
    setTimeout(function(){ chip.classList.add('dragging'); }, 0);
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragState.fromId);
  });

  main.addEventListener('dragend', function(){
    dragState.dragging = false;
    dragState.lastDropTime = Date.now();
    document.querySelectorAll('.subject-chip').forEach(function(c){
      c.classList.remove('dragging','drag-over');
    });
  });

  main.addEventListener('dragover', function(e){
    if(!dragState.dragging) return;
    var chip = e.target.closest('[data-drag-subject-id]');
    if(!chip) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.subject-chip').forEach(function(c){ c.classList.remove('drag-over'); });
    if(chip.dataset.dragSubjectId !== dragState.fromId) chip.classList.add('drag-over');
  });

  main.addEventListener('dragleave', function(e){
    var chip = e.target.closest('[data-drag-subject-id]');
    if(chip && !chip.contains(e.relatedTarget)) chip.classList.remove('drag-over');
  });

  main.addEventListener('drop', async function(e){
    e.preventDefault();
    dragState.dragging = false;
    dragState.lastDropTime = Date.now();
    document.querySelectorAll('.subject-chip').forEach(function(c){
      c.classList.remove('dragging','drag-over');
    });

    if(assignReorderBusy) return;

    var toChip = e.target.closest('[data-drag-subject-id]');
    var fromId = dragState.fromId;
    var companyId = dragState.companyId;
    dragState.fromId = null;

    if(!toChip || !fromId || !companyId) return;
    var toId = toChip.dataset.dragSubjectId;
    if(fromId === toId) return;

    var assigns = getCompanyAssignments(companyId);
    var fromIdx = assigns.findIndex(function(a){ return String(a.과목ID)===String(fromId); });
    var toIdx   = assigns.findIndex(function(a){ return String(a.과목ID)===String(toId); });
    if(fromIdx<0 || toIdx<0) return;

    var moved = assigns.splice(fromIdx,1)[0];
    assigns.splice(toIdx,0,moved);

    if(state.url){
      assignReorderBusy = true;
      setStatus('loading');
      setOrderButtonsBusy(true);
      var dropOk = await writeDomainAction('reorderAssignments', {
        companyId:companyId,
        assignmentIds:assigns.map(function(a){ return a.배정ID; })
      });
      assignReorderBusy = false;
      setOrderButtonsBusy(false);
      if(dropOk) await fetchData(state.url);
    } else {
      assigns.forEach(function(a,i){ a.순서 = i+1; });
      render();
    }
  });

  (function setupTabsHandlerOnce(){
    var oldTabsEl = document.getElementById('tabs');
    if(!oldTabsEl) return;
    var freshTabsEl = oldTabsEl.cloneNode(true);
    oldTabsEl.parentNode.replaceChild(freshTabsEl, oldTabsEl);

    freshTabsEl.addEventListener('click', function(e){
      try{
        var btn = e.target.closest('.tab-btn');
        if(!btn) return;
        state.activeTab = btn.dataset.tab;
        state.selectedCompanyId = null;
        state.selectedSubjectId = null;
        render();
      }catch(err){ console.error('tab click error', err); }
    });
  })();
</script>
